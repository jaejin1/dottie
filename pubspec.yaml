name: dottie
description: "Dottie - 같은 하루, 다른 발자국. 하루를 점으로 기록하는 지도 브이로그 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # 지도
  mapbox_maps_flutter: ^2.5.0

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2

  # 상태 관리
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 라우팅
  go_router: ^14.8.1

  # 인증 - 소셜 로그인
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  kakao_flutter_sdk_user: ^1.9.8

  # 네트워크
  dio: ^5.8.0+1

  # 로컬 저장소
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.30
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4

  # 위치
  geolocator: ^13.0.2
  permission_handler: ^11.4.0

  # 알림
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1

  # 이미지/미디어
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # 모델 코드 생성 annotation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # 애니메이션
  lottie: ^3.3.1

  # UI 유틸리티
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # 코드 생성
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.4
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
